name: Build and checks
on:
    push:
    pull_request:
permissions:
    contents: read
jobs:
    offline:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Install build and test tools
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes lua5.4 gcc-mingw-w64-x86-64-posix
            - name: Build original native helpers
              run: |
                  python3 scripts/build_forestry_bridge.py
                  python3 scripts/build_perks_bridge.py
                  python3 scripts/build_soil_bridge.py
                  python3 scripts/build_world_bridge.py
                  python3 scripts/build_ux_bridge.py
            - name: Run offline checks
              run: bash scripts/test.sh
            - name: Check release packaging
              run: python3 scripts/prepare_nexus.py --out ./release
